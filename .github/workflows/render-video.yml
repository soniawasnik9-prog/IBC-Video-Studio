name: Render IBC Presenter Quality Test

on:
  workflow_dispatch:
    inputs:
      format:
        description: "Video format"
        required: true
        type: choice
        options:
          - both
          - landscape
          - vertical
        default: both

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg fonts-dejavu-core libegl1 libgl1 libgles2 libglib2.0-0 libsm6 libxrender1 libxext6

      - name: Install voice tool
        run: python -m pip install --upgrade pip edge-tts

      - name: Prepare output
        run: mkdir -p output

      - name: Generate Indian English narration and matching subtitles
        run: |
          edge-tts --voice en-IN-NeerjaNeural --file data/narration.txt --write-media output/ibc_voice.mp3 --write-subtitles output/ibc_voice.srt
          test -s output/ibc_voice.mp3
          test -s output/ibc_voice.srt

      - name: Render landscape preview
        if: ${{ inputs.format == 'both' || inputs.format == 'landscape' }}
        run: |
          blender --background --python scripts/ibc_presenter_test.py -- --output output/ibc_test_landscape_silent.mp4 --format landscape
          test -s output/ibc_test_landscape_silent.mp4

      - name: Render vertical preview
        if: ${{ inputs.format == 'both' || inputs.format == 'vertical' }}
        run: |
          blender --background --python scripts/ibc_presenter_test.py -- --output output/ibc_test_vertical_silent.mp4 --format vertical
          test -s output/ibc_test_vertical_silent.mp4

      - name: Add timed captions and voice-over
        run: |
          if [ -s output/ibc_test_landscape_silent.mp4 ]; then
            ffmpeg -y -i output/ibc_test_landscape_silent.mp4 -i output/ibc_voice.mp3 \
              -vf "subtitles=output/ibc_voice.srt:fontsdir=/usr/share/fonts/truetype/dejavu:force_style='FontName=DejaVu Sans,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H00101828,BorderStyle=1,Outline=2,Shadow=0,Alignment=2,MarginV=34'" \
              -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -crf 24 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest -movflags +faststart output/ibc_test_landscape.mp4
          fi
          if [ -s output/ibc_test_vertical_silent.mp4 ]; then
            ffmpeg -y -i output/ibc_test_vertical_silent.mp4 -i output/ibc_voice.mp3 \
              -vf "subtitles=output/ibc_voice.srt:fontsdir=/usr/share/fonts/truetype/dejavu:force_style='FontName=DejaVu Sans,FontSize=18,PrimaryColour=&H00FFFFFF,OutlineColour=&H00101828,BorderStyle=1,Outline=2,Shadow=0,Alignment=2,MarginV=72'" \
              -map 0:v:0 -map 1:a:0 -c:v libx264 -preset ultrafast -crf 24 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest -movflags +faststart output/ibc_test_vertical.mp4
          fi
          test -s output/ibc_voice.mp3

      - name: Upload quality-test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ibc-presenter-quality-test
          path: output/
          if-no-files-found: error
          retention-days: 7
